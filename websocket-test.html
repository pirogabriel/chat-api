<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Chat Test</title>
</head>
<body>
<h2>Real WebSocket Chat Test</h2>

<label>Access Token:</label><br>
<textarea id="token" placeholder="Paste accessToken here" rows="4" cols="80"></textarea>

<br><br>

<label>Room ID:</label><br>
<input id="roomId" placeholder="Room ID" value="1">

<button onclick="connect()">Connect</button>
<button onclick="disconnect()">Disconnect</button>

<br><br>

<label>Message:</label><br>
<input id="message" placeholder="Message">
<button onclick="sendMessage()">Send</button>

<h3>Status:</h3>
<p id="status">Disconnected</p>

<h3>Messages:</h3>
<ul id="messages"></ul>

<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>

<script>
    let client;

    function connect() {
        const roomId = document.getElementById("roomId").value;
        const token = document.getElementById("token").value.trim();

        if (!token) {
            alert("Paste your accessToken first");
            return;
        }

        client = new StompJs.Client({
            brokerURL: "ws://localhost:8080/ws",

            connectHeaders: {
                Authorization: "Bearer " + token
            },

            debug: function (str) {
                console.log(str);
            },

            reconnectDelay: 5000,

            onConnect: function () {
                document.getElementById("status").innerText = "Connected to room " + roomId;

                client.subscribe("/topic/rooms/" + roomId, function (message) {
                    const msg = JSON.parse(message.body);

                    const li = document.createElement("li");
                    li.innerText =
                        "[" + msg.createdAt + "] " +
                        msg.senderUsername +
                        ": " +
                        msg.content;

                    document.getElementById("messages").appendChild(li);
                });
            },

            onStompError: function (frame) {
                console.error("Broker error:", frame.headers["message"]);
                console.error("Details:", frame.body);
                document.getElementById("status").innerText = "STOMP error";
            },

            onWebSocketError: function (error) {
                console.error("WebSocket error:", error);
                document.getElementById("status").innerText = "WebSocket error";
            },

            onDisconnect: function () {
                document.getElementById("status").innerText = "Disconnected";
            }
        });

        client.activate();
    }

    function sendMessage() {
        const roomId = document.getElementById("roomId").value;
        const content = document.getElementById("message").value;

        if (!client || !client.connected) {
            alert("Connect first");
            return;
        }

        client.publish({
            destination: "/app/rooms/" + roomId + "/send",
            body: JSON.stringify({
                content: content
            })
        });

        document.getElementById("message").value = "";
    }

    function disconnect() {
        if (client) {
            client.deactivate();
            document.getElementById("status").innerText = "Disconnected";
        }
    }
</script>
</body>
</html>
